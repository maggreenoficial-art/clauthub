<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Hot Clauth IA">
  <defs>
    <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#ig)"/>
  <rect width="400" height="400" fill="url(#shine)"/>
  <circle cx="200" cy="168" r="92" fill="none" stroke="#fff" stroke-width="14" opacity="0.95"/>
  <circle cx="200" cy="168" r="58" fill="none" stroke="#fff" stroke-width="14" opacity="0.95"/>
  <circle cx="236" cy="132" r="11" fill="#fff"/>
  <text x="200" y="182" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="118" font-weight="800" fill="#fff" filter="url(#glow)">C</text>
  <text x="200" y="292" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff" letter-spacing="2">HOT CLAUTH IA</text>
  <text x="200" y="328" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="rgba(255,255,255,0.88)" letter-spacing="3">ENGAJAMENTO</text>
</svg>

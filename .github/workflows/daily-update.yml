name: Atualizacao Diaria

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Buscar seguidores e recalcular investimentos
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemini-2.5-flash
        run: python scripts/update_metrics.py

      - name: Publicar paginas atualizadas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualizacao automatica diaria de metricas"
          file_pattern: "index.html relatoriofinaceiro/index.html"
